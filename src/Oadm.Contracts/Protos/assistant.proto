syntax = "proto3";
package oadm.v1;
option csharp_namespace = "Oadm.Contracts.V1";
import "Protos/common.proto";

// The Assistant (docs/spec/assistant.md): a chat with an AI model in the client's side panel. The server runs the
// conversation with the provider and the tool registry as the signed-in user; the client only shows it.
// Chat, Stop, Run and End need the permission "Use the assistant"; the settings are Administrator only (Get for every
// signed-in user, without the key). FAILED_PRECONDITION "The assistant is off." while it is off.
service AssistantService {
  // One user message; the answer streams as events until AssistantEvent.done. A new Chat while one streams for the same
  // conversation: FAILED_PRECONDITION "Wait for the answer or stop it.". RESOURCE_EXHAUSTED "The assistant reached
  // today's limit. It works again tomorrow." at the daily limit.
  rpc Chat (AssistantMessage) returns (stream AssistantEvent);
  // Ends the answer that streams for this conversation (its Chat ends with done.stopped = true).
  rpc Stop (AssistantConversationRequest) returns (Empty);
  // Runs a preview the model asked for: the run tool of the preview with its handle, only for the user that asked.
  // NOT_FOUND "This preview has ended. Ask again." for an unknown, used or ended handle.
  rpc Run (AssistantRunRequest) returns (AssistantRunReply);
  // Forgets the conversation (panel closed, New chat).
  rpc End (AssistantConversationRequest) returns (Empty);
  rpc GetSettings (Empty) returns (AssistantSettingsState);
  // INVALID_ARGUMENT with trailer oadm-field (provider, address, model, api_key, daily_limit, user_daily_limit).
  rpc SetSettings (AssistantSettings) returns (AssistantSettingsState);
  // One short call with the given settings (the saved key when api_key is empty); never saves.
  rpc Test (AssistantSettings) returns (AssistantTestReply);
}

message AssistantConversationRequest {
  string conversation_id = 1;   // made by the client (a GUID) when the panel opens or New chat
}

message AssistantAttachment {
  string file_id = 1;           // from FileService.Upload
  string name = 2;
  int64 size = 3;
}

message AssistantMessage {
  string conversation_id = 1;
  string text = 2;                          // 1..8,000 characters
  repeated string selected_device_ids = 3;  // the device grid's selection, at most 10,000
  repeated AssistantAttachment attachments = 4;
}

message AssistantEvent {
  oneof kind {
    string text = 1;                       // the next piece of the answer (Markdown)
    AssistantToolLine tool = 2;            // "Looking at devices"
    AssistantPreviewCard preview = 3;
    AssistantPicture picture = 4;
    AssistantTable table = 5;
    AssistantDone done = 6;
    string notice = 7;                     // shown once, e.g. "Your messages and the data the assistant reads go to Anthropic."
  }
}

message AssistantToolLine {
  string text = 1;
  bool failed = 2;                         // the tool refused; text says why in short
}

message AssistantPreviewCard {
  string handle = 1;                       // for Run
  string title = 2;                        // "Upgrade AXIS OS to 12.6.97"
  int32 device_count = 3;
  repeated string skipped = 4;             // "3 devices: Site offline"
  repeated string warnings = 5;
  repeated string first_devices = 6;       // the first 20 names
  string expires_utc = 7;                  // ISO 8601; the handle ends then
}

message AssistantPicture {
  string device_id = 1;
  string device_name = 2;
  bytes jpeg = 3;
}

message AssistantTable {
  repeated AssistantDeviceRow rows = 1;    // at most 50
  int32 total = 2;                         // all matching devices; > rows: "+N more"
  repeated string all_device_ids = 3;      // for Select all in the grid, at most 10,000
}

message AssistantDeviceRow {
  string device_id = 1;
  string name = 2;
  string address = 3;
  string model = 4;
  string status = 5;
}

message AssistantDone {
  bool stopped = 1;
  string error = 2;                        // "The provider did not answer. Try again." etc.; empty when it answered
  int64 tokens = 3;                        // this answer's tokens
}

message AssistantRunRequest {
  string conversation_id = 1;
  string handle = 2;
}

message AssistantRunReply {
  string batch_id = 1;
  int32 task_count = 2;
  repeated string task_ids = 3;            // the card follows them in the client's task store
}

message AssistantSettings {
  bool enabled = 1;
  string provider = 2;                     // "anthropic", "openai", "ollama", "openai-compatible"
  string address = 3;                      // Ollama and OpenAI-compatible
  string model = 4;
  string api_key = 5;                      // write only; empty keeps the saved one
  bool send_pictures = 6;
  int64 daily_limit = 7;                   // tokens a day for the server, default 2,000,000
  int64 user_daily_limit = 8;              // 0 = no limit per user
}

message AssistantSettingsState {
  AssistantSettings settings = 1;          // api_key always empty
  bool has_api_key = 2;
  int64 used_today = 3;
  repeated string models = 4;              // the provider's list when it offers one; may be empty
  string status = 5;                       // "On", "Off", "Choose a model."
}

message AssistantTestReply {
  bool ok = 1;
  string message = 2;                      // the model's answer, or what is wrong in plain words
}
