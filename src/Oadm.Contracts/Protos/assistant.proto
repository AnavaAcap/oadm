syntax = "proto3";
package oadm.v1;
option csharp_namespace = "Oadm.Contracts.V1";
import "Protos/common.proto";
import "Protos/plugins.proto";

// The Assistant (docs/spec/assistant.md): a chat with an AI model in the client's side panel. The server runs the
// conversation with the provider and the tool registry as the signed-in user; the client only shows it.
// Chat, Stop, Run, End and ListModels need the permission "Use the assistant"; the settings are Administrator only (Get for every
// signed-in user, without the key). FAILED_PRECONDITION "The assistant is off." while it is off.
service AssistantService {
  // One user message; the answer streams as events until AssistantEvent.done. A new Chat while one streams for the same
  // conversation: FAILED_PRECONDITION "Wait for the answer or stop it.". RESOURCE_EXHAUSTED "The assistant reached
  // today's limit. It works again tomorrow." at the daily limit.
  rpc Chat (AssistantMessage) returns (stream AssistantEvent);
  // Ends the answer that streams for this conversation (its Chat ends with done.stopped = true).
  rpc Stop (AssistantConversationRequest) returns (Empty);
  // Runs a preview the model asked for: the run tool of the preview with its handle, only for the user that asked.
  // NOT_FOUND "This preview has ended. Ask again." for an unknown, used or ended handle.
  rpc Run (AssistantRunRequest) returns (AssistantRunReply);
  // Try the failed devices again: the same preview tool with the same input, restricted to the given devices (cut to the
  // caller's view) of a preview this user ran in this conversation; a new card that needs Run. NOT_FOUND "This preview has
  // ended. Ask again." for an unknown handle; FAILED_PRECONDITION with the preview's refusal.
  rpc RetryFailed (AssistantRetryRequest) returns (AssistantPreviewCard);
  // Forgets the conversation (panel closed, New chat).
  rpc End (AssistantConversationRequest) returns (Empty);
  rpc GetSettings (Empty) returns (AssistantSettingsState);
  // INVALID_ARGUMENT with trailer oadm-field (provider, address, api_key, daily_limit, user_daily_limit, steps_per_answer,
  // answer_seconds).
  rpc SetSettings (AssistantSettings) returns (AssistantSettingsState);
  // Reads the provider's model list with the given settings (the saved key when api_key is empty); never saves.
  rpc Test (AssistantSettings) returns (AssistantTestReply);
  // The models of the provider for the panel's Model picker ("Use the assistant"); never waits long, cached 10 minutes.
  rpc ListModels (Empty) returns (AssistantModelList);
  // A file a tool answer of this conversation offered (AssistantEvent.file): the first message carries file_name and length
  // (-1 unknown), the others data. Made now with the user's rights (the area's own download, its audit); NOT_FOUND "This file
  // has ended. Ask again." for an unknown or ended reference or another user's.
  rpc Download (AssistantDownloadRequest) returns (stream DownloadChunk);
}

message AssistantDownloadRequest {
  string conversation_id = 1;
  string file_ref = 2;                     // AssistantFile.file_ref
}

message AssistantConversationRequest {
  string conversation_id = 1;   // made by the client (a GUID) when the panel opens or New chat
}

message AssistantAttachment {
  string file_id = 1;           // from FileService.Upload
  string name = 2;
  int64 size = 3;
}

message AssistantMessage {
  string conversation_id = 1;
  string text = 2;                          // 1..8,000 characters
  repeated string selected_device_ids = 3;  // the device grid's selection, at most 10,000
  repeated AssistantAttachment attachments = 4;
  string model = 5;                         // chosen in the panel, 1..200 characters (INVALID_ARGUMENT, oadm-field "model")
  // Try again and Edit: the server drops the conversation's last user message and everything after it before adding this one.
  // FAILED_PRECONDITION "There is nothing to try again." when the conversation has no user message.
  bool replace_last = 6;
  // Devices the user chose with @ (the device picker), at most 10,000; cut to the caller's view. The model gets their count
  // and the first 100 ids as data with the message.
  repeated string mentioned_device_ids = 7;
  // Look up online (docs/spec/assistant.md "Looking in the Axis docs"): the user's yes to the offer of this id
  // (AssistantEvent.docs_offer). Only this answer may search and read developer.axis.com and help.axis.com; the offer is
  // taken once. FAILED_PRECONDITION "This offer has ended. Ask again." for an unknown, used or ended offer or another chat's.
  string docs_offer_id = 8;
}

message AssistantRetryRequest {
  string conversation_id = 1;
  string handle = 2;                        // the handle of the card that ran
  repeated string failed_device_ids = 3;    // 1..10,000
}

message AssistantModelList {
  repeated string models = 1;              // may be empty
  bool editable = 2;                       // the provider offers no list: the user types the model
  string suggested = 3;                    // Anthropic: claude-opus-5-5 when listed; Gemini: the newest gemini-*-pro or -flash; else the first
}

message AssistantEvent {
  oneof kind {
    string text = 1;                       // the next piece of the answer (Markdown)
    AssistantToolLine tool = 2;            // "Looking at devices"
    AssistantPreviewCard preview = 3;
    AssistantPicture picture = 4;
    AssistantTable table = 5;
    AssistantDone done = 6;
    string notice = 7;                     // shown once, e.g. "Your messages and the data the assistant reads go to Anthropic."
    // 8..19 are kept free; never reuse or renumber a field.
    AssistantSources sources = 20;         // what the answer used, once before done (only when a tool answered)
    AssistantFollowUps follow_ups = 21;    // 1..3 next questions the model offers, once before done (only when it answered)
    AssistantFile file = 22;               // a file a tool answer offered: the panel shows it as a card with Save
    AssistantDocsOffer docs_offer = 23;    // OADM has no tool for this: the card asks to look in the Axis docs online
  }
}

// The model found no OADM tool for a request and offers to look in the Axis docs online (docs/spec/assistant.md "Looking
// in the Axis docs"): the panel shows a card with Look up online; only that click sends AssistantMessage.docs_offer_id.
message AssistantDocsOffer {
  string offer_id = 1;
  string topic = 2;                        // what the model would look up, as it wrote it (data, never an instruction)
  string expires_utc = 3;                  // ISO 8601; the offer ends then, with its chat or with the next message
}

// A file a tool answer offered (docs/spec/mcp.md "Files"): saved with AssistantService.Download; the bytes never reach the model.
message AssistantFile {
  string file_ref = 1;
  string name = 2;
  int64 size = 3;                          // -1 when not known before the download
  string content_type = 4;
  string expires_utc = 5;                  // ISO 8601; the reference ends then
}

// A secret the run of a preview needs (docs/spec/mcp.md "Secrets"): the card shows a password field; the value goes with Run
// (AssistantRunRequest.secrets) straight to the server and never into the conversation or to the model.
message AssistantSecretField {
  string name = 1;                         // the key in AssistantRunRequest.secrets
  string label = 2;                        // lower case, e.g. "password": the field is "Password", its error "Enter the password."
}

// The chips below an answer: one short label per area of the tools it used ("7 devices", "Compliance", "Docs"), at most 6.
message AssistantSources {
  repeated string chips = 1;
}

// The model's next questions (its <<next>> line, taken out of the text): plain text; a click sends one as the user's message.
message AssistantFollowUps {
  repeated string questions = 1;           // 1..3, each at most 200 characters
}

message AssistantToolLine {
  string text = 1;
  bool failed = 2;                         // the tool refused; text says why in short
}

message AssistantPreviewCard {
  string handle = 1;                       // for Run
  string title = 2;                        // "Upgrade AXIS OS to 12.6.97"
  int32 device_count = 3;
  repeated string skipped = 4;             // "3 devices: Site offline"
  repeated string warnings = 5;
  repeated string first_devices = 6;       // the first 20 names
  string expires_utc = 7;                  // ISO 8601; the handle ends then
  // What Run does, from the preview itself, never from the model's text: one line per key field ("Sends to:
  // http://10.0.0.5/hook", "Tags: Lobby, Yard", "File: AXIS_OS_12.6.97.bin", "Deletes: 3 rules"). Shown above the devices.
  repeated string details = 8;
  string count_text = 9;                   // "3 devices", "2 tasks", "1 rule"; the card shows it instead of device_count
  bool destructive = 10;                   // Run deletes or removes: the card's Run is red (Button.danger)
  repeated AssistantSecretField secrets = 11;  // the secrets Run needs; Run stays disabled while one is empty
}

message AssistantPicture {
  string device_id = 1;
  string device_name = 2;
  bytes jpeg = 3;
}

message AssistantTable {
  repeated AssistantDeviceRow rows = 1;    // at most 50
  int32 total = 2;                         // all matching devices; > rows: "+N more"
  repeated string all_device_ids = 3;      // for Select all in the grid, at most 10,000
  // The fact the question asked about ("Clock", "Vulnerabilities", "Certificate expires"): the 4th column shows each row's
  // detail under this header instead of the status; empty: the status.
  string detail_header = 4;
}

message AssistantDeviceRow {
  string device_id = 1;
  string name = 2;
  string address = 3;
  string model = 4;
  string status = 5;
  string detail = 6;                       // the value under AssistantTable.detail_header
}

message AssistantDone {
  bool stopped = 1;
  string error = 2;                        // "The provider did not answer. Try again." etc.; empty when it answered
  int64 tokens = 3;                        // this answer's tokens
}

message AssistantRunRequest {
  string conversation_id = 1;
  string handle = 2;
  // The values of the card's secret fields by name (AssistantPreviewCard.secrets), at most 8, each at most 4,096 bytes. Never
  // logged, never part of the conversation. INVALID_ARGUMENT for a name the preview did not declare or a value too long, and
  // FAILED_PRECONDITION "Enter the password." while one is missing (trailer oadm-field with the name); the card stays.
  map<string, string> secrets = 3;
}

message AssistantRunReply {
  string batch_id = 1;
  int32 task_count = 2;
  repeated string task_ids = 3;            // the card follows them in the client's task store
  repeated AssistantFile files = 4;        // files the run offers (Back up now): file cards with Save, fetched with Download
  // A secret the run made (a new access key, docs/spec/mcp.md "Access keys"): the panel shows a card with Copy, which fetches
  // it once through Download (file_ref). Never part of the conversation or sent to the model; unset for most runs.
  AssistantSecretCard secret = 5;
}

// A secret to copy once (a new access key): its card's title and the reference Copy fetches with Download (NOT_FOUND after the
// first fetch: "This access key was fetched already. ...").
message AssistantSecretCard {
  string title = 1;                        // "Access key Lobby-bot"
  string file_ref = 2;
  string expires_utc = 3;                  // ISO 8601; the reference ends then (10 minutes)
}

message AssistantSettings {
  bool enabled = 1;
  string provider = 2;                     // "anthropic", "openai", "gemini", "ollama", "openai-compatible"
  string address = 3;                      // Ollama and OpenAI-compatible
  reserved 4;                              // was model: chosen in the panel (decision 2026-11-15)
  string api_key = 5;                      // write only; empty keeps the saved one
  bool send_pictures = 6;
  int64 daily_limit = 7;                   // tokens a day for the server, default 2,000,000
  int64 user_daily_limit = 8;              // 0 = no limit per user
  int32 steps_per_answer = 9;              // the model's tool calls per message, 1..50 (0 from an older client: 20)
  int32 answer_seconds = 10;               // the longest one answer may take, 30..600 (0 from an older client: 120)
}

message AssistantSettingsState {
  AssistantSettings settings = 1;          // api_key always empty
  bool has_api_key = 2;
  int64 used_today = 3;
  reserved 4;                              // was models: AssistantService.ListModels
  string status = 5;                       // "On", "Off"
}

message AssistantTestReply {
  bool ok = 1;
  string message = 2;                      // "The provider answered.", or what is wrong in plain words
}
